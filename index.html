<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web of Science 課程前自我評量表</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* Custom Styles to ensure better mobile experience */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9fafb;
        }
        .cursor-wait {
            cursor: wait;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        
        // Lucide Icons components wrapper since we're using UMD build
        const BookOpen = () => <i data-lucide="book-open" className="w-8 h-8 text-purple-700"></i>;
        const CheckCircle = () => <i data-lucide="check-circle" className="w-10 h-10 text-green-600"></i>;
        const Send = () => <i data-lucide="send" className="w-5 h-5 ml-2"></i>;
        const AlertCircle = () => <i data-lucide="alert-circle" className="inline-block w-4 h-4 mr-2 mb-1"></i>;
        const Info = () => <i data-lucide="info" className="w-5 h-5 text-purple-700"></i>;

        const App = () => {
            const [submitted, setSubmitted] = useState(false);
            const [loading, setLoading] = useState(false);
            const iframeRef = useRef(null);
            const formRef = useRef(null);

            // Google Form Action URL
            const GOOGLE_FORM_ACTION_URL = "https://docs.google.com/forms/u/0/d/e/1FAIpQLSf0WURbso9UHb7UIDgQUoyBuD5KmaHj5pmbUVC31r2GopjQPw/formResponse";

            // Field IDs configuration
            const FIELD_IDS = {
                studentId: "entry.616274275",  
                q1: "entry.1220592937",
                q2: "entry.2234618",
                q3: "entry.1432302666",
                q4: "entry.331905490",
                q5: "entry.2006442008",
                q6: "entry.1951508483"
            };
            
            const FBZX_TOKEN = "-1574618325326581094"; 

            const questions = [
                {
                    id: "q1",
                    entryId: FIELD_IDS.q1,
                    title: "1. 精確檢索與運算元",
                    text: "為了提升檢索的精準度，當我需要查找特定專有名詞或同時包含多種字詞變化時，我知道如何運用「片語檢索(\" \")」、「萬用字元(*, $, ?)」或「布林邏輯(AND, OR, NOT)」來組合檢索式。"
                },
                {
                    id: "q2",
                    entryId: FIELD_IDS.q2,
                    title: "2. 篩選與精煉結果",
                    text: "當檢索出的文獻數量過多時，我能利用左側的「快速篩選（Quick Filters）」功能，依據需求找出「高被引論文」或「回顧性文章」，以快速鎖定該領域具影響力或統整性的重點文獻。"
                },
                {
                    id: "q3",
                    entryId: FIELD_IDS.q3,
                    title: "3. 引文網絡追蹤",
                    text: "當我找到一篇與研究主題高度相關的核心論文時，我知道如何利用「引用文獻網絡」，查看其「參考文獻」與「被引用次數」，藉此追溯研究的起源背景與後續發展。"
                },
                {
                    id: "q4",
                    entryId: FIELD_IDS.q4,
                    title: "4. 分析檢索結果",
                    text: "為了快速掌握特定研究主題的整體趨勢，我能使用「分析結果（Analyze Results）」功能，以視覺化圖表檢視該領域的主要「出版國家/地區」、「研究機構」或「熱門期刊」分佈情形。"
                },
                {
                    id: "q5",
                    entryId: FIELD_IDS.q5,
                    title: "5. 新知追蹤與訂閱",
                    text: "為了在未來持續接收感興趣主題的最新研究，而不需要每天重複檢索，我會使用「建立追蹤（Create Alert）」功能，設定關鍵字或特定文獻的引用通知，讓系統自動寄送 Email 提醒我。"
                },
                {
                    id: "q6",
                    entryId: FIELD_IDS.q6,
                    title: "6. 文獻匯出與管理",
                    text: "為了進行後續的研究或寫作，我知道如何將篩選後的檢索結果，批次「匯出」至 EndNote 軟體、Excel 或純文字檔案中保存與整理。"
                }
            ];

            // Re-render icons after state changes
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const handleSubmit = () => {
                setLoading(true);
                setTimeout(() => {
                    setSubmitted(true);
                    setLoading(false);
                    window.scrollTo(0, 0);
                }, 2000); 
            };

            if (submitted) {
                return (
                    <div className="min-h-screen bg-purple-50 flex items-center justify-center p-4 font-sans">
                        <div className="bg-white rounded-xl shadow-xl p-8 max-w-md w-full text-center transform transition-all duration-500 hover:scale-105">
                            <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                <CheckCircle />
                            </div>
                            <h2 className="text-2xl font-bold text-gray-800 mb-4">感謝您的填寫！</h2>
                            <p className="text-gray-600 mb-2 leading-relaxed">
                                您的回饋對我們非常重要。<br/>這將幫助圖書館優化未來的課程內容。
                            </p>
                            <p className="text-sm text-gray-400 mt-6">
                                您現在可以關閉此視窗
                            </p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 py-8 px-4 sm:px-6 lg:px-8 font-sans">
                    {/* Hidden iframe for form submission */}
                    <iframe
                        name="hidden_iframe"
                        id="hidden_iframe"
                        style={{ display: "none" }}
                        ref={iframeRef}
                        title="hidden-frame"
                    ></iframe>

                    <div className="max-w-3xl mx-auto">
                        {/* Header Card */}
                        <div className="bg-white rounded-xl shadow-lg overflow-hidden mb-6 border-t-8 border-purple-700">
                            <div className="p-6 sm:p-10">
                                <div className="flex items-center gap-3 mb-4">
                                    <BookOpen />
                                    <h1 className="text-2xl sm:text-3xl font-bold text-gray-900">
                                        Web of Science 課程前自我評量表
                                    </h1>
                                </div>
                                
                                <div className="prose text-gray-600 mb-6">
                                    <p className="mb-2">各位師長、同學大家好：</p>
                                    <p className="mb-4">
                                        歡迎您參與圖書館舉辦之利用教育課程。這份評量主要目的是想要瞭解大家在這門課程前對資料庫的了解程度。
                                    </p>
                                    <p className="text-sm bg-purple-50 p-4 rounded-lg border border-purple-100 text-purple-800 mb-6 flex items-start">
                                        <AlertCircle />
                                        <span>您的填答結果僅做為我們改善課程製作及內容深度調整的依據，我們不會將個人資料與填答內容外洩，請放心填寫。</span>
                                    </p>
                                </div>
                                
                                {/* Scoring Legend */}
                                <div className="bg-gray-50 rounded-lg border border-gray-200 overflow-hidden">
                                    <div className="bg-gray-100 px-4 py-2 border-b border-gray-200 flex items-center gap-2">
                                        <Info />
                                        <h3 className="font-bold text-gray-800 text-sm">評分標準說明</h3>
                                    </div>
                                    <div className="p-4 text-sm text-gray-700 space-y-3">
                                        <div className="flex items-start gap-3">
                                            <span className="bg-purple-100 text-purple-800 font-bold px-2 py-0.5 rounded text-xs whitespace-nowrap mt-0.5">5 分：精通</span>
                                            <span>能獨立流暢完成，並清楚解釋</span>
                                        </div>
                                        <div className="flex items-start gap-3">
                                            <span className="bg-purple-100 text-purple-800 font-bold px-2 py-0.5 rounded text-xs whitespace-nowrap mt-0.5">4 分：熟悉</span>
                                            <span>大致可完成，但需參考說明</span>
                                        </div>
                                        <div className="flex items-start gap-3">
                                            <span className="bg-purple-100 text-purple-800 font-bold px-2 py-0.5 rounded text-xs whitespace-nowrap mt-0.5">3 分：尚可</span>
                                            <span>需引導，部分功能不熟悉</span>
                                        </div>
                                        <div className="flex items-start gap-3">
                                            <span className="bg-purple-100 text-purple-800 font-bold px-2 py-0.5 rounded text-xs whitespace-nowrap mt-0.5">2 分：略懂</span>
                                            <span>知道功能，但不清楚如何使用</span>
                                        </div>
                                        <div className="flex items-start gap-3">
                                            <span className="bg-gray-200 text-gray-700 font-bold px-2 py-0.5 rounded text-xs whitespace-nowrap mt-0.5">1 分：未學</span>
                                            <span>從未聽過此功能</span>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>

                        <form
                            ref={formRef}
                            action={GOOGLE_FORM_ACTION_URL}
                            method="POST"
                            target="hidden_iframe"
                            onSubmit={handleSubmit}
                            className="space-y-6"
                        >
                            {/* Required hidden fields for Google Form validation */}
                            <input type="hidden" name="fvv" value="1" />
                            <input type="hidden" name="fbzx" value={FBZX_TOKEN} />
                            <input type="hidden" name="pageHistory" value="0" />

                            {/* Student ID Field */}
                            <div className="bg-white rounded-xl shadow-md p-6 sm:p-8 transition hover:shadow-lg">
                                <label htmlFor="studentId" className="block text-lg font-semibold text-gray-800 mb-3">
                                    學號 / 人事代碼 <span className="text-red-500">*</span>
                                </label>
                                <input
                                    type="text"
                                    name={FIELD_IDS.studentId}
                                    id="studentId"
                                    required
                                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition bg-gray-50 focus:bg-white"
                                    placeholder="請輸入您的學號或代碼"
                                />
                            </div>

                            {/* Questions */}
                            {questions.map((q, index) => (
                                <div key={q.id} className="bg-white rounded-xl shadow-md p-6 sm:p-8 transition hover:shadow-lg group">
                                    <h3 className="text-lg font-semibold text-gray-800 mb-2 group-hover:text-purple-700 transition-colors">
                                        {q.title} <span className="text-red-500">*</span>
                                    </h3>
                                    <p className="text-gray-600 mb-6 text-sm sm:text-base leading-relaxed">
                                        {q.text}
                                    </p>
                                    
                                    <div className="flex flex-col sm:flex-row justify-between items-center gap-4 bg-gray-50 p-4 rounded-xl border border-gray-100">
                                        <span className="text-sm font-medium text-gray-500 hidden sm:block">未學 (1)</span>
                                        <div className="flex w-full sm:w-auto justify-between gap-2 sm:gap-6">
                                            {[1, 2, 3, 4, 5].map((score) => (
                                                <label key={score} className="flex flex-col items-center cursor-pointer relative">
                                                    <input
                                                        type="radio"
                                                        name={q.entryId}
                                                        value={score}
                                                        required
                                                        className="peer sr-only"
                                                    />
                                                    <div className="w-10 h-10 sm:w-12 sm:h-12 rounded-full border-2 border-gray-300 bg-white flex items-center justify-center text-gray-500 font-bold transition-all peer-checked:border-purple-600 peer-checked:bg-purple-600 peer-checked:text-white peer-checked:scale-110 peer-hover:border-purple-300 peer-focus:ring-2 peer-focus:ring-purple-300">
                                                        {score}
                                                    </div>
                                                    <span className="mt-2 text-xs text-gray-500 sm:hidden">
                                                        {score === 1 ? '未學' : score === 5 ? '精通' : ''}
                                                    </span>
                                                </label>
                                            ))}
                                        </div>
                                        <span className="text-sm font-medium text-purple-700 hidden sm:block">精通 (5)</span>
                                    </div>
                                </div>
                            ))}

                            {/* Submit Button */}
                            <div className="flex justify-end pt-4 pb-12">
                                <button
                                    type="submit"
                                    disabled={loading}
                                    className={`flex items-center gap-2 px-8 py-4 bg-purple-700 text-white text-lg font-semibold rounded-xl shadow-lg hover:bg-purple-800 hover:shadow-xl focus:outline-none focus:ring-4 focus:ring-purple-300 transition-all transform active:scale-95 disabled:opacity-70 disabled:cursor-wait`}
                                >
                                    {loading ? '提交中...' : (
                                        <React.Fragment>
                                            提交問卷 <Send />
                                        </React.Fragment>
                                    )}
                                </button>
                            </div>
                        </form>

                        {/* Footer */}
                        <div className="text-center text-gray-400 text-sm pb-8">
                            <p>東吳大學 圖書館 敬上</p>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
