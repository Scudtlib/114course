<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web of Science 課程前自我評量表</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 React 和 ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 引入 Babel 用來解析 JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Segoe UI', Microsoft JhengHei, sans-serif; }
  </style>
</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- 圖示組件 (SVG) ---
    const BookOpen = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    );
    const CheckCircle = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    );
    const Send = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    );
    const AlertCircle = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    );
    const Award = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
    );
    const Network = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/></svg>
    );
    const Filter = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
    );
    const BarChart2 = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    );
    const FileText = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    );
    const Bell = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    );

    // --- 主程式 ---
    const WOSAssessment = () => {
      const [submitted, setSubmitted] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      // Google Form Action URL
      const GOOGLE_FORM_ACTION_URL = "https://docs.google.com/forms/u/0/d/e/1FAIpQLSd8-LXVwlTBfbqwRT_YaB4CxbYAP5e5RqB0gjApbHfqYTGmHw/formResponse";

      // Field Mapping
      const FIELD_IDS = {
        studentId: "entry.1049510090",
        q1: "entry.218688928",
        q2: "entry.730065242",
        q3: "entry.324659021",
        q4: "entry.636589151",
        q5: "entry.2086348459",
        q6: "entry.1541872549",
      };

      const [formData, setFormData] = useState({
        [FIELD_IDS.studentId]: '',
        [FIELD_IDS.q1]: '',
        [FIELD_IDS.q2]: '',
        [FIELD_IDS.q3]: '',
        [FIELD_IDS.q4]: '',
        [FIELD_IDS.q5]: '',
        [FIELD_IDS.q6]: '',
      });

      // 選項設定 (用於渲染 UI)
      // 注意：value 必須與 Google Forms 定義的完全一致
      const optionsConfig = [
        { score: "5", label: "精通", value: "5分：精通 (能獨立流暢完成，並清楚解釋)" },
        { score: "4", label: "熟悉", value: "4分：熟悉 (大致可完成，但需參考說明)" },
        { score: "3", label: "尚可", value: "3分：尚可 (需引導，部分功能不熟悉)" },
        { score: "2", label: "略懂", value: "2分：略懂 (知道功能，但不清楚如何使用)" },
        { score: "1", label: "未學", value: "1分：未學 (從未聽過此功能)" }
      ];

      const questions = [
        {
          id: FIELD_IDS.q1,
          icon: <Award className="w-5 h-5 text-purple-600" />,
          text: "1. 當我接觸一個新的研究主題時，我能運用 Research Assistant 功能快速生成文獻摘要與重點整理。"
        },
        {
          id: FIELD_IDS.q2,
          icon: <Network className="w-5 h-5 text-purple-600" />,
          text: "2. 當我找到一篇關鍵文獻後，我知道如何利用引用文獻網路，去追溯它的學術源頭與後續影響。"
        },
        {
          id: FIELD_IDS.q3,
          icon: <Filter className="w-5 h-5 text-purple-600" />,
          text: "3. 當我的初步檢索結果過多或過於發散時，我能使用篩選及限縮功能，精準地找到我需要的文獻。"
        },
        {
          id: FIELD_IDS.q4,
          icon: <BarChart2 className="w-5 h-5 text-purple-600" />,
          text: "4. 為了掌握特定研究領域的發展趨勢，我能透過分析結果功能，找出該領域的核心國家、機構與學者。"
        },
        {
          id: FIELD_IDS.q5,
          icon: <FileText className="w-5 h-5 text-purple-600" />,
          text: "5. 在評估一群文章的整體學術影響力時，我懂得如何運用引用文獻報告來觀察其發表趨勢與被引用狀況。"
        },
        {
          id: FIELD_IDS.q6,
          icon: <Bell className="w-5 h-5 text-purple-600" />,
          text: "6. 為了持續追蹤特定主題或重要學者的最新研究，我知道如何設定追蹤功能以自動接收新訊通知。"
        }
      ];

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({
          ...prev,
          [name]: value
        }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError('');

        const allFilled = Object.values(formData).every(val => val.trim() !== '');
        if (!allFilled) {
          setError('請填寫所有欄位，包含學號及所有問題。');
          setLoading(false);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }

        try {
          const formBody = new URLSearchParams();
          Object.keys(formData).forEach(key => {
            formBody.append(key, formData[key]);
          });

          await fetch(GOOGLE_FORM_ACTION_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: formBody.toString()
          });

          setSubmitted(true);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (err) {
          console.error(err);
          setError('傳送失敗，請檢查您的網路連線或稍後再試。');
        } finally {
          setLoading(false);
        }
      };

      if (submitted) {
        return (
          <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4 font-sans">
            <div className="bg-white rounded-2xl shadow-xl p-8 max-w-lg w-full text-center border-t-8 border-purple-600">
              <div className="mx-auto w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mb-6">
                <CheckCircle className="w-8 h-8 text-green-600" />
              </div>
              <h2 className="text-2xl font-bold text-gray-800 mb-4">提交成功！</h2>
              <p className="text-gray-600 mb-8">
                感謝您完成「Web of Science」課程前自我評量表。您的回覆已成功記錄。
              </p>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-50 font-sans pb-8">
          {/* Header Banner */}
          <div className="bg-gradient-to-r from-purple-800 to-indigo-900 text-white py-8 px-4 shadow-lg">
            <div className="max-w-3xl mx-auto">
              <div className="flex items-center gap-2 mb-2">
                <BookOpen className="w-6 h-6 opacity-90" />
                <span className="text-sm font-medium tracking-wider uppercase opacity-80">圖書館利用教育課程系列</span>
              </div>
              <h1 className="text-2xl md:text-3xl font-bold mb-2">「Web of Science」課程前自我評量表</h1>
              <p className="text-purple-100 text-base max-w-2xl leading-relaxed">
                為了讓講師能更精準地掌握大家的學習需求，請根據您目前的了解程度填寫此問卷。
              </p>
            </div>
          </div>

          <div className="max-w-3xl mx-auto -mt-4 px-4 relative z-10">
            
            {/* Error Message */}
            {error && (
              <div className="mb-4 bg-red-50 border-l-4 border-red-500 p-3 rounded-r shadow-sm flex items-start gap-3">
                <AlertCircle className="w-5 h-5 text-red-600 mt-0.5 flex-shrink-0" />
                <div className="text-red-700 text-sm">{error}</div>
              </div>
            )}

            {/* Instructions Card */}
            <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-6 mb-4">
              <h2 className="text-base font-semibold text-gray-800 mb-3 flex items-center gap-2">
                <span className="w-1 h-5 bg-purple-600 rounded-full"></span>
                評分標準說明
              </h2>
              <div className="grid gap-2 text-sm">
                <div className="flex gap-2 items-baseline p-1.5 rounded hover:bg-purple-50 transition-colors">
                  <span className="font-bold text-purple-700 min-w-[2.5rem]">5分</span>
                  <span className="text-gray-700"><span className="font-semibold text-gray-900">精通</span>：能獨立流暢完成，並清楚解釋</span>
                </div>
                <div className="flex gap-2 items-baseline p-1.5 rounded hover:bg-purple-50 transition-colors">
                  <span className="font-bold text-purple-700 min-w-[2.5rem]">4分</span>
                  <span className="text-gray-700"><span className="font-semibold text-gray-900">熟悉</span>：大致可完成，但需參考說明</span>
                </div>
                <div className="flex gap-2 items-baseline p-1.5 rounded hover:bg-purple-50 transition-colors">
                  <span className="font-bold text-purple-700 min-w-[2.5rem]">3分</span>
                  <span className="text-gray-700"><span className="font-semibold text-gray-900">尚可</span>：需引導，部分功能不熟悉</span>
                </div>
                <div className="flex gap-2 items-baseline p-1.5 rounded hover:bg-purple-50 transition-colors">
                  <span className="font-bold text-purple-700 min-w-[2.5rem]">2分</span>
                  <span className="text-gray-700"><span className="font-semibold text-gray-900">略懂</span>：知道功能，但不清楚如何使用</span>
                </div>
                <div className="flex gap-2 items-baseline p-1.5 rounded hover:bg-purple-50 transition-colors">
                  <span className="font-bold text-purple-700 min-w-[2.5rem]">1分</span>
                  <span className="text-gray-700"><span className="font-semibold text-gray-900">未學</span>：從未聽過此功能</span>
                </div>
              </div>
            </div>

            <form onSubmit={handleSubmit} className="space-y-4">
              
              {/* Student ID Section */}
              <div className="bg-white rounded-xl shadow-sm border-t-4 border-purple-500 p-4 md:p-6">
                <label htmlFor="studentId" className="block text-base font-bold text-gray-800 mb-2">
                  學號 / 人事代碼 <span className="text-red-500">*</span>
                </label>
                <input
                  type="text"
                  id="studentId"
                  name={FIELD_IDS.studentId}
                  value={formData[FIELD_IDS.studentId]}
                  onChange={handleChange}
                  placeholder="請輸入您的學號或代碼"
                  className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-200 focus:border-purple-600 outline-none transition-all text-gray-700 placeholder-gray-400 text-sm"
                />
              </div>

              {/* Questions */}
              {questions.map((q, index) => (
                <div key={q.id} className="bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-6 hover:shadow-md transition-shadow">
                  <div className="flex gap-3 mb-4">
                    <div className="flex-shrink-0 mt-0.5 bg-purple-50 p-1.5 rounded-lg h-fit">
                      {q.icon}
                    </div>
                    <h3 className="text-base md:text-lg font-medium text-gray-800 leading-snug">
                      {q.text} <span className="text-red-500">*</span>
                    </h3>
                  </div>

                  {/* 橫式 5 點量表 */}
                  <div className="flex flex-col sm:flex-row gap-2">
                    {optionsConfig.map((opt) => {
                      const isSelected = formData[q.id] === opt.value;
                      return (
                        <label 
                          key={opt.score} 
                          className={`
                            flex-1 relative group cursor-pointer
                            flex flex-col items-center justify-center
                            p-2 rounded-lg border transition-all duration-200
                            ${isSelected 
                              ? 'border-purple-600 bg-purple-50 text-purple-900' 
                              : 'border-gray-200 hover:border-purple-300 hover:bg-gray-50'
                            }
                          `}
                        >
                          <input
                            type="radio"
                            name={q.id}
                            value={opt.value}
                            checked={isSelected}
                            onChange={handleChange}
                            className="peer sr-only"
                          />
                          
                          {/* 選中指示標記 (Check Icon) */}
                          {isSelected && (
                            <div className="absolute top-1 right-1 text-purple-600">
                              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                            </div>
                          )}

                          <div className={`text-lg font-bold mb-0.5 ${isSelected ? 'text-purple-700' : 'text-gray-500 group-hover:text-purple-600'}`}>
                            {opt.score}
                          </div>
                          <div className={`text-xs font-medium ${isSelected ? 'text-purple-800' : 'text-gray-500 group-hover:text-gray-700'}`}>
                            {opt.label}
                          </div>
                        </label>
                      );
                    })}
                  </div>
                </div>
              ))}

              {/* Submit Button */}
              <div className="flex flex-col items-center gap-3 mt-6">
                <button
                  type="submit"
                  disabled={loading}
                  className={`
                    group relative w-full md:w-auto min-w-[200px] px-6 py-3 rounded-xl text-base font-bold text-white shadow-lg
                    flex items-center justify-center gap-2 transition-all transform hover:-translate-y-1 hover:shadow-xl
                    ${loading ? 'bg-gray-400 cursor-not-allowed' : 'bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700'}
                  `}
                >
                  {loading ? (
                    <div className="w-6 h-6 border-3 border-white border-t-transparent rounded-full animate-spin" />
                  ) : (
                    <>
                      提交問卷
                      <Send className="w-5 h-5 group-hover:translate-x-1 transition-transform" />
                    </>
                  )}
                </button>
                <p className="text-xs text-gray-500">
                  請確認所有欄位皆已填寫
                </p>
              </div>

            </form>

            <footer className="text-center py-6 text-gray-400 text-xs">
              &copy; Web of Science Pre-Assessment Form
            </footer>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<WOSAssessment />);
  </script>
</body>
</html>
