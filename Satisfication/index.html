<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專題講座滿意度調查 - 任務開始</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #10b981;
            --accent: #f59e0b;
        }
        body { font-family: 'Noto Sans TC', sans-serif; overflow-x: hidden; }
        .game-font { font-family: 'Bungee', 'Noto Sans TC', sans-serif; }
        
        .bg-mesh {
            background-color: #f8fafc;
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0, transparent 50%), 
                              radial-gradient(at 50% 0%, rgba(16, 185, 129, 0.1) 0, transparent 50%);
        }

        /* 換題動畫 */
        .content-fade { animation: contentSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes contentSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-enter { animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .xp-float {
            position: absolute;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 1000;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.5); }
        }

        .likert-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid #f3f4f6;
            background: white;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .likert-btn:active { transform: scale(0.98); }
        .likert-btn.selected { 
            background-color: var(--primary); 
            color: white; 
            border-color: var(--primary); 
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4); 
        }

        .progress-bar { transition: width 0.6s cubic-bezier(0.65, 0, 0.35, 1); }
        
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }
    </style>
</head>
<body class="bg-mesh min-h-screen text-gray-800">

    <!-- 頂部進度條 -->
    <div id="progress-container" class="fixed top-0 left-0 w-full h-2 bg-gray-200 z-50 hidden">
        <div id="main-progress" class="h-full bg-indigo-600 progress-bar" style="width: 0%"></div>
    </div>

    <div id="app" class="container mx-auto p-4 max-w-2xl min-h-screen flex flex-col justify-center">

        <!-- [首頁] -->
        <div id="home-page" class="text-center card-enter">
            <div class="relative inline-block mb-3">
                <div class="absolute -inset-1 bg-gradient-to-r from-indigo-600 to-emerald-500 rounded-full blur opacity-25"></div>
                <div class="relative bg-white p-6 rounded-full shadow-xl">
                    <svg class="w-16 h-16 text-indigo-500 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                    </svg>
                </div>
            </div>
            
            <div class="space-y-2 mb-8">
                <h1 class="text-3xl sm:text-4xl font-black text-gray-900 tracking-tight leading-tight uppercase">專題講座<br>滿意度調查</h1>
                <p class="text-indigo-600 font-bold tracking-widest uppercase text-xs sm:text-sm">Satisfaction Mastery Quest</p>
            </div>

            <div class="pt-4">
                <button onclick="startJourney()" class="group relative bg-white p-8 rounded-3xl shadow-lg border-2 border-transparent hover:border-indigo-500 transition-all text-center overflow-hidden active:scale-95 w-full">
                    <h3 class="text-2xl font-bold text-gray-800">開始挑戰</h3>
                    <p class="text-gray-500 text-sm mt-2">您的回饋是我們升級講座品質的重要經驗值！</p>
                    <div class="mt-6 inline-flex items-center text-indigo-500 font-black text-xl">START MISSION <span class="ml-2">→</span></div>
                </button>
            </div>
        </div>

        <!-- [任務內容頁面] -->
        <div id="quest-page" class="hidden card-enter">
            <div id="quest-card" class="bg-white rounded-3xl shadow-2xl p-6 md:p-10 relative overflow-hidden">
                <div id="step-header" class="mb-8">
                    <span id="step-badge" class="px-3 py-1 bg-indigo-100 text-indigo-600 rounded-full text-xs font-bold uppercase tracking-widest">Stage 1</span>
                    <h2 id="question-text" class="text-xl md:text-2xl font-bold text-gray-800 mt-4 leading-relaxed">載入任務中...</h2>
                </div>

                <div id="question-content" class="min-h-[220px]">
                    <!-- 動態內容將插入於此 -->
                </div>

                <div class="flex items-center justify-between mt-12 border-t pt-8">
                    <button id="prev-btn" onclick="prevStep()" class="text-gray-400 font-bold hover:text-gray-600 transition-colors py-2 px-4 rounded-lg">← BACK</button>
                    <div id="step-indicator" class="text-gray-300 font-bold text-sm tracking-widest font-mono">01 / 10</div>
                    <button id="next-btn" onclick="nextStep()" class="bg-indigo-600 text-white px-8 py-3 rounded-full font-bold shadow-lg hover:bg-indigo-700 transition-all transform active:scale-95">NEXT</button>
                </div>
            </div>
        </div>

        <!-- [成功提交頁面] -->
        <div id="results-page" class="hidden text-center card-enter">
             <div class="bg-white p-10 rounded-3xl shadow-2xl space-y-6">
                <div class="w-32 h-32 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-yellow-400">
                    <span class="text-5xl">🏆</span>
                </div>
                <h2 class="text-3xl font-black text-gray-800">任務完成！</h2>
                <p class="text-gray-500 leading-relaxed">感謝您的寶貴意見，您的回饋已成功送達。預祝您今日收穫滿滿！</p>
                <div class="pt-6">
                    <button onclick="location.reload()" class="bg-gray-800 text-white px-10 py-4 rounded-full font-bold hover:bg-black transition-all">重新開始任務</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Google 表單配置 (精確對應連結 ID 與「其他」特殊欄位)
        const FORM_CONFIG = {
            url: "https://docs.google.com/forms/d/e/1FAIpQLSeoDEfuo2VHZD_JfyUhNBzZi96EtiwN1__UF3InlWVgnPOR7Q/formResponse",
            entries: {
                userId: "entry.378923667",
                gender: "entry.408196360",
                status: "entry.659472740",
                statusOther: "entry.659472740.other_option_response",
                college: "entry.644204744",
                collegeOther: "entry.644204744.other_option_response",
                department: "entry.702987340",
                motivation: "entry.441084087",
                motivationOther: "entry.441084087.other_option_response",
                q1: "entry.716809508",
                q2: "entry.739406782",
                feedback: "entry.1167175727",
                futureTopics: "entry.886271649"
            }
        };

        const steps = [
            { type: 'input', label: '基本資料', question: '請輸入您的學號或人事代碼', id: 'userId', placeholder: '學號 / 人事代碼' },
            { type: 'select', label: '基本資料', question: '1. 您的生理性別', id: 'gender', options: ['男', '女'] },
            { type: 'select', label: '基本資料', question: '2. 您的身分別', id: 'status', options: ['大學部', '碩士生', '博士生', '教師', '職員', '其他'], hasOther: true },
            { type: 'select', label: '基本資料', question: '3. 所屬學院/單位', id: 'college', options: ['人文社會學院', '外國語文學院', '理學院', '法學院', '商學院', '巨量資料管理學院', '行政單位', '其他'], hasOther: true },
            { type: 'input', label: '基本資料', question: '4. 所屬學系/單位', id: 'department', placeholder: '例如：企管系' },
            { type: 'checkbox', label: '參與動機', question: '5. 請問您參加本次課程的動機為何？(可複選)', id: 'motivation', options: ['提升論文寫作與研究能力', '增進個人專業知能', '對目前/未來工作有助益', '老師推薦/課程要求', '對主題感興趣', '其他'], hasOther: true },
            { type: 'likert', label: '滿意度評估', question: '6. 今日的課程講授，對於提昇我自己的研究／搜尋技能很有幫助', id: 'q1' },
            { type: 'likert', label: '滿意度評估', question: '7. 主講人能夠正確並清楚地表達講授的內容', id: 'q2' },
            { type: 'textarea', label: '心得回饋', question: '8. 對於本次課程，您有任何建議或想分享的心得嗎?', id: 'feedback', optional: true },
            { type: 'textarea', label: '未來期望', question: '9. 您下次希望參加的課程內容為何?', id: 'futureTopics', optional: true }
        ];

        let currentStep = 0;
        let answers = {};

        function startJourney() {
            currentStep = 0;
            answers = {};
            renderStep();
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('quest-page').classList.remove('hidden');
            document.getElementById('progress-container').classList.remove('hidden');
        }

        function renderStep() {
            const step = steps[currentStep];
            const content = document.getElementById('question-content');
            const questionText = document.getElementById('question-text');
            const stepBadge = document.getElementById('step-badge');
            const indicator = document.getElementById('step-indicator');
            const nextBtn = document.getElementById('next-btn');

            content.classList.remove('content-fade');
            void content.offsetWidth; 
            content.classList.add('content-fade');
            content.innerHTML = ''; 
            
            questionText.innerHTML = `${step.question}${step.optional ? ' <span class="text-gray-400 text-sm font-normal ml-2">(選填)</span>' : ' <span class="text-red-500 font-bold ml-1">*</span>'}`;

            stepBadge.innerText = step.label;
            indicator.innerText = `${String(currentStep + 1).padStart(2, '0')} / ${steps.length}`;
            
            const progress = ((currentStep) / (steps.length - 1)) * 100;
            document.getElementById('main-progress').style.width = `${progress}%`;
            document.getElementById('prev-btn').style.visibility = currentStep === 0 ? 'hidden' : 'visible';
            nextBtn.innerText = currentStep === steps.length - 1 ? 'FINISH' : 'NEXT';

            if (step.type === 'input') {
                const el = document.createElement('input');
                el.type = 'text';
                el.id = `input-${step.id}`;
                el.value = answers[step.id] || '';
                el.className = 'w-full border-b-4 border-gray-100 py-4 text-2xl font-bold outline-none focus:border-indigo-500 transition-all';
                el.placeholder = step.placeholder;
                content.appendChild(el);
                setTimeout(() => el.focus(), 300);
            } else if (step.type === 'textarea') {
                const el = document.createElement('textarea');
                el.id = `input-${step.id}`;
                el.className = 'w-full border-2 border-gray-100 rounded-2xl p-4 text-lg outline-none focus:border-indigo-500 transition-all';
                el.rows = 4;
                el.value = answers[step.id] || '';
                el.placeholder = '請分享您的想法...';
                content.appendChild(el);
            } else if (step.type === 'likert') {
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-5 gap-2 mt-4';
                [5,4,3,2,1].forEach(v => {
                    const btn = document.createElement('button');
                    btn.className = `likert-btn py-6 rounded-2xl font-black text-xl ${answers[step.id] == v ? 'selected' : ''}`;
                    btn.innerText = v;
                    btn.onclick = (e) => {
                        answers[step.id] = v;
                        Array.from(grid.children).forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        createXP(e.clientX, e.clientY);
                        setTimeout(nextStep, 350);
                    };
                    grid.appendChild(btn);
                });
                content.appendChild(grid);
                const labels = document.createElement('div');
                labels.className = 'flex justify-between mt-4 text-xs text-gray-400 font-bold px-2';
                labels.innerHTML = `<span>非常同意 🤩</span><span>非常不同意 😤</span>`;
                content.appendChild(labels);
            } else if (step.type === 'select') {
                const wrapper = document.createElement('div');
                wrapper.className = 'space-y-4';
                
                const select = document.createElement('select');
                select.id = `input-${step.id}`;
                select.className = 'w-full border-2 border-gray-200 rounded-2xl p-4 text-xl font-bold outline-none focus:border-indigo-500 transition-all bg-white cursor-pointer';
                
                const saved = answers[step.id] || { value: '', otherText: '' };
                select.innerHTML = `<option value="" disabled ${!saved.value ? 'selected' : ''}>請點擊選擇...</option>` + 
                                  step.options.map(o => `<option value="${o}" ${saved.value === o ? 'selected' : ''}>${o}</option>`).join('');
                
                const otherInp = document.createElement('input');
                otherInp.type = 'text';
                otherInp.id = `input-${step.id}-other`;
                otherInp.placeholder = '請詳細填寫...';
                otherInp.value = saved.otherText || '';
                otherInp.className = 'w-full border-b-2 border-indigo-200 py-3 text-lg font-bold outline-none focus:border-indigo-500 transition-all mt-2';
                otherInp.style.display = saved.value === '其他' ? 'block' : 'none';

                select.onchange = () => {
                    if (select.value === '其他') {
                        otherInp.style.display = 'block';
                        otherInp.focus();
                    } else {
                        otherInp.style.display = 'none';
                        otherInp.value = '';
                        answers[step.id] = { value: select.value, otherText: '' };
                        setTimeout(nextStep, 350);
                    }
                };
                wrapper.appendChild(select);
                wrapper.appendChild(otherInp);
                content.appendChild(wrapper);
            } else if (step.type === 'checkbox') {
                const wrapper = document.createElement('div');
                wrapper.className = 'space-y-3';
                
                const saved = answers[step.id] || { values: [], otherText: '' };
                
                step.options.forEach(o => {
                    const label = document.createElement('label');
                    label.className = 'flex items-center p-4 bg-gray-50 rounded-2xl cursor-pointer hover:bg-gray-100 transition-colors border-2 border-transparent';
                    const isChecked = saved.values.includes(o);
                    
                    label.innerHTML = `
                        <input type="checkbox" name="${step.id}" value="${o}" ${isChecked ? 'checked' : ''} class="w-6 h-6 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                        <span class="ml-4 font-bold text-gray-700">${o}</span>
                    `;
                    
                    if (o === '其他') {
                        const otherInp = document.createElement('input');
                        otherInp.type = 'text';
                        otherInp.id = 'motivation-other-text';
                        otherInp.placeholder = '請說明內容...';
                        otherInp.value = saved.otherText || '';
                        otherInp.className = 'ml-4 flex-1 border-b-2 border-gray-300 focus:border-indigo-500 outline-none px-2 py-1 text-sm bg-transparent';
                        otherInp.style.display = isChecked ? 'inline-block' : 'none';
                        label.appendChild(otherInp);
                        
                        label.querySelector('input').onchange = (e) => {
                            otherInp.style.display = e.target.checked ? 'inline-block' : 'none';
                            if (e.target.checked) otherInp.focus();
                        };
                    }
                    wrapper.appendChild(label);
                });
                content.appendChild(wrapper);
            }
        }

        function createXP(x, y) {
            const xp = document.createElement('div');
            xp.className = 'xp-float font-black text-indigo-500 text-xl';
            xp.innerText = '+XP';
            xp.style.left = (x - 20) + 'px';
            xp.style.top = (y - 20) + 'px';
            document.body.appendChild(xp);
            setTimeout(() => xp.remove(), 800);
        }

        function nextStep() {
            const step = steps[currentStep];
            if (step.type === 'input' || step.type === 'textarea') {
                const el = document.getElementById(`input-${step.id}`);
                const val = el ? el.value.trim() : '';
                if (!val && !step.optional) {
                    if (event && event.type === 'click') alert('此欄位為必填項目，請完成後再繼續！');
                    return;
                }
                answers[step.id] = val;
            } else if (step.type === 'select') {
                const sel = document.getElementById(`input-${step.id}`);
                const other = document.getElementById(`input-${step.id}-other`);
                if (!sel.value && !step.optional) {
                    alert('請選擇一個選項！');
                    return;
                }
                if (sel.value === '其他' && !other.value.trim()) {
                    alert('請填寫其他說明！');
                    return;
                }
                answers[step.id] = { value: sel.value, otherText: other ? other.value.trim() : '' };
            } else if (step.type === 'checkbox') {
                const checked = Array.from(document.querySelectorAll(`input[name="${step.id}"]:checked`)).map(c => c.value);
                const otherText = document.getElementById('motivation-other-text').value.trim();
                if (checked.length === 0 && !step.optional) {
                    if (event && event.type === 'click') alert('請至少勾選一項！');
                    return;
                }
                if (checked.includes('其他') && !otherText) {
                    alert('請填寫其他動機說明！');
                    return;
                }
                answers[step.id] = { values: checked, otherText: otherText };
            }

            if (currentStep < steps.length - 1) {
                currentStep++;
                renderStep();
            } else {
                submitFinal();
            }
        }

        function prevStep() {
            if (currentStep > 0) {
                currentStep--;
                renderStep();
            }
        }

        function submitFinal() {
            const nextBtn = document.getElementById('next-btn');
            nextBtn.disabled = true;
            nextBtn.innerText = "SUBMITTING...";

            const params = new URLSearchParams();
            
            // 基礎資料
            params.append(FORM_CONFIG.entries.userId, answers.userId || "");
            params.append(FORM_CONFIG.entries.gender, answers.gender ? answers.gender.value : "");
            
            // 身分別處理 (支援 Google Form __other_option__)
            if (answers.status) {
                if (answers.status.value === '其他') {
                    params.append(FORM_CONFIG.entries.status, "__other_option__");
                    params.append(FORM_CONFIG.entries.statusOther, answers.status.otherText);
                } else {
                    params.append(FORM_CONFIG.entries.status, answers.status.value);
                }
            }
            
            // 學院處理 (支援 Google Form __other_option__)
            if (answers.college) {
                if (answers.college.value === '其他') {
                    params.append(FORM_CONFIG.entries.college, "__other_option__");
                    params.append(FORM_CONFIG.entries.collegeOther, answers.college.otherText);
                } else {
                    params.append(FORM_CONFIG.entries.college, answers.college.value);
                }
            }
            
            params.append(FORM_CONFIG.entries.department, answers.department || "");
            
            // 參與動機 (多選 + 其他)
            if (answers.motivation) {
                answers.motivation.values.forEach(v => {
                    if (v === '其他') {
                        params.append(FORM_CONFIG.entries.motivation, "__other_option__");
                        params.append(FORM_CONFIG.entries.motivationOther, answers.motivation.otherText);
                    } else {
                        params.append(FORM_CONFIG.entries.motivation, v);
                    }
                });
            }
            
            // 滿意度
            params.append(FORM_CONFIG.entries.q1, answers.q1 || "");
            params.append(FORM_CONFIG.entries.q2, answers.q2 || "");
            params.append(FORM_CONFIG.entries.feedback, answers.feedback || "");
            params.append(FORM_CONFIG.entries.futureTopics, answers.futureTopics || "");

            fetch(FORM_CONFIG.url, { 
                method: 'POST', 
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                body: params.toString() 
            })
            .then(() => {
                document.getElementById('quest-page').classList.add('hidden');
                document.getElementById('results-page').classList.remove('hidden');
                document.getElementById('progress-container').classList.add('hidden');
            })
            .catch(err => {
                console.error("提交錯誤:", err);
                alert('提交失敗，請檢查網路連線。');
                nextBtn.disabled = false;
                nextBtn.innerText = "FINISH";
            });
        }
    </script>
</body>
</html>
